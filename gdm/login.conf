# GNOMAC login screen settings (read by GDM's shell at each boot).
# Edit this file as root, then restart the machine (or: sudo systemctl restart gdm).
# Anything missing keeps its default. A line starting with # is a comment.

[login]
# Clock at the top: big, small or none
clock = big
# Show Sleep / Restart / Shut Down buttons at the bottom: true or false
power-buttons = true
# Wallpaper brightness, 0.3 (dark) to 1.0 (as is)
dim = 0.8
# Show the date above the clock: true or false
date = true
# Wallpaper file (a JPEG or PNG readable by everyone)
wallpaper = /usr/share/gnomac/login.jpg
# Seconds the wallpaper takes to fade in (0 = at once)
fade = 1.2
# Avatar size in pixels, 64 to 160
avatar-size = 104
# Accent colour of the login screen (hex)
accent = #0a84ff
